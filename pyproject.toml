[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-updown-bot"
version = "1.0.0"
description = "Trading bot for Polymarket's 5-minute crypto Up/Down markets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "py-clob-client>=0.34",
    "web3>=7.0",
    "eth-abi>=5.0",
    "requests>=2.31",
    "websocket-client>=1.6",
    "rich>=13.7",
    "questionary>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
updown-bot = "updown_bot.__main__:main"

[tool.setuptools]
packages = ["updown_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP045"]
